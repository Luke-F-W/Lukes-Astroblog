name: CI
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: cicd
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: install dependencies
        run: npm ci
      - name: testing and checks
        run: |
          npm run test:unit
          npm run lint
          npm run check
          npm run build

      - name: build docker
          npm run lint
          npm run check
        run: docker build -t astro-test .

      - name: run docker
        run: docker run -d --name app -p 4321:4321 astro-test

      - name: test health endpoint
        run: curl -fs --retry 15 --retry-delay 5 --retry-connrefused http://localhost:4321/api/health